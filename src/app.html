<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved public-site theme before first paint (see $lib/theme.ts).
			try {
				if (localStorage.getItem('feed-theme') === 'light') {
					document.documentElement.dataset.theme = 'light';
				}
			} catch (e) {}
			// Separator width, matching X as measured: one device pixel on
			// screens scaled between 1x and 2x (0.72px at 1.4x), 1px on
			// high-density phones (3x). See --hairline in app.css.
			var dpr = window.devicePixelRatio || 1;
			document.documentElement.style.setProperty('--hairline', (dpr > 1 && dpr < 2 ? 1 / dpr : 1) + 'px');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
